    <style id="certificate-flip-layer-fix">
      /* Keep the front text from being painted through the certificate image on flipped cards. */
      .certificate-flipper {
        -webkit-transform-style: preserve-3d;
      }

      .certificate-face {
        -webkit-backface-visibility: hidden !important;
        backface-visibility: hidden !important;
        will-change: transform, opacity;
      }

      .certificate-front {
        z-index: 2;
        opacity: 1;
        visibility: visible;
        transform: rotateY(0deg) translateZ(1px);
        transition: opacity 0.08s linear 0.32s, visibility 0s linear 0.32s;
      }

      .certificate-back {
        z-index: 1;
        opacity: 1;
        visibility: visible;
        transform: rotateY(180deg) translateZ(1px);
      }

      .certificate-card:hover .certificate-front,
      .certificate-card:focus .certificate-front {
        opacity: 0;
        visibility: hidden;
      }

      .certificate-card:hover .certificate-back,
      .certificate-card:focus .certificate-back {
        z-index: 3;
      }

      .hero-portfolio-cta {
        z-index: 8;
        color: #31566a;
        background: #f2c653;
        border: 1px solid #d9aa3c;
        border-radius: 999px;
        align-items: center;
        gap: 18px;
        padding: 14px 18px 14px 22px;
        font-family: Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: clamp(14px, 1.18vw, 18px);
        font-weight: 900;
        line-height: 1;
        text-decoration: none;
        display: inline-flex;
        position: absolute;
        top: 50.5%;
        left: 6.2%;
        box-shadow: 0 7px 0 #d7a844, 0 16px 28px #6d572c2b;
        transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
      }

      .hero-portfolio-cta b {
        font-family: Georgia, serif;
        font-size: 21px;
        font-weight: 400;
        transition: transform .3s ease;
      }

      .hero-portfolio-cta:hover,
      .hero-portfolio-cta:focus-visible {
        color: #31566a;
        background: #f7cf67;
        outline: none;
        transform: translateY(-3px);
        box-shadow: 0 10px 0 #d7a844, 0 20px 34px #6d572c33;
      }

      .hero-portfolio-cta:hover b,
      .hero-portfolio-cta:focus-visible b {
        transform: translate(3px, 3px);
      }

      @media (max-width: 900px) {
        .hero-portfolio-cta {
          top: 45.5%;
          left: 7%;

        }

        .hero-portfolio-cta b {
          font-size: 18px;
        }
      }

    <style id="direct-project-anchor-fix">
      .ai-work-card[id], .peg-card[id] { scroll-margin-top: 110px; }
      .direct-project-target {
        animation: direct-project-pulse 1.5s ease-out;
      }
      @keyframes direct-project-pulse {
        0%, 35% { box-shadow: 0 0 0 7px rgba(244, 200, 90, 0.9), 0 18px 42px rgba(41, 72, 93, 0.2); }
        100% { box-shadow: inherit; }
      }
    </style>

  <body>
    <div id="root"></div>
    <script id="direct-project-navigation">
      (() => {
        const requestedProject = () => {
          const hash = decodeURIComponent(location.hash.slice(1));
          return hash || new URLSearchParams(location.search).get("project") || "";
        };

        const positionProject = (attempt = 0) => {
          const projectId = requestedProject();
          if (!projectId) return;
          const target = document.getElementById(projectId);
          if (target) {
            const destination = Math.max(0, window.scrollY + target.getBoundingClientRect().top - 110);
            window.scrollTo(0, destination);
            document.documentElement.scrollTop = destination;
            document.body.scrollTop = destination;
            target.classList.add("direct-project-target");
            window.setTimeout(() => target.classList.remove("direct-project-target"), 1800);
            if (attempt < 50 && Math.abs(target.getBoundingClientRect().top - 110) > 40) {
              window.setTimeout(() => positionProject(attempt + 1), 100);
            }
            return;
          }
          if (attempt < 50) window.setTimeout(() => positionProject(attempt + 1), 100);
        };

        window.addEventListener("DOMContentLoaded", () => positionProject());
        window.addEventListener("load", () => positionProject(1));
        window.addEventListener("hashchange", () => positionProject());
        window.setTimeout(() => positionProject(1), 400);
        window.setTimeout(() => positionProject(1), 1200);
      })();
    </script>
  </body>
